name: Library checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm pack --dry-run
  swift-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/test-ios-core.sh
  swiftpm-consumer:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: tests/spm/package-lock.json
      - run: npm run test:spm
  kotlin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - run: gradle --project-dir android/core-tests test --no-daemon --console=plain
