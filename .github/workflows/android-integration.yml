name: Android integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [24, 25, 35, 36]
    env:
      ANDROID_INTEGRATION_WORK: ${{ github.workspace }}/.android-integration
      ANDROID_TEST_ABI: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: tests/android/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Install build SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build packed-library Debug and Release consumers
        run: sh scripts/test-android-integration.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run image, modal, rotation and resume checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            set -eu
            for variant in debug release; do
              adb install -r "$ANDROID_INTEGRATION_WORK/consumer/android/app/build/outputs/apk/$variant/app-$variant.apk"
              python3 tests/android/run-device.py --serial emulator-5554 --output "$ANDROID_INTEGRATION_WORK/results/$variant"
            done
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-api-${{ matrix.api }}
          path: .android-integration/results
          if-no-files-found: warn
