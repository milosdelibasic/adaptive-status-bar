plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.1.20'
}

repositories {
  maven { url = uri("https://repo1.maven.org/maven2") }
  mavenCentral()
}

kotlin {
  jvmToolchain(17)
}

sourceSets {
  main.kotlin.srcDirs = ['../src/main/java/com/skyvist/adaptivestatusbar/core']
  test.kotlin.srcDirs = ['../src/test/java/com/skyvist/adaptivestatusbar/core']
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}

test {
  testLogging {
    events 'failed'
    exceptionFormat 'full'
  }
}

// Opt-in CPU microbenchmark; not part of the normal test suite or npm payload.
sourceSets {
  benchmark.kotlin.srcDirs = ['../benchmarks']
  benchmark.compileClasspath += sourceSets.main.output
  benchmark.runtimeClasspath += sourceSets.main.output
  test.kotlin.srcDirs += ['../benchmarks/reference']
}
configurations {
  benchmarkImplementation.extendsFrom implementation
  benchmarkRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('benchmarkLuminance', JavaExec) {
  classpath = sourceSets.benchmark.runtimeClasspath
  mainClass = 'com.skyvist.adaptivestatusbar.core.LuminanceBenchmarkKt'
}
